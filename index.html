<script>
    // Strikte E-Mail-Validierungsfunktion
    function isValidEmail(email) {
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return regex.test(email);
    }

    function updateRewardsView(points) {
        document.getElementById('user-points').innerHTML = `${points} Ptz <span style="font-size:16px; color:#555;">/ 500</span>`;

        const thresholds = [50, 150, 300, 500];
        thresholds.forEach(t => {
            const el = document.getElementById(`reward-${t}`);
            if (el) {
                if (points >= t) {
                    el.classList.add('unlocked');
                    el.querySelector('.reward-lock').innerText = '🔓 Antippen';
                } else {
                    el.classList.remove('unlocked');
                    el.querySelector('.reward-lock').innerText = '🔒';
                }
            }
        });
    }

    // ECHTER ABMELDEN-FIX
    function logoutUser() {
        // Löscht alle gespeicherten Login-Daten im Browser
        localStorage.removeItem('user_email');
        localStorage.clear();
        
        // Lädt die App komplett neu, sodass der User wieder beim Login/Eingabefeld landet
        location.reload();
    }
</script>
