<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Scanner - Midus Lounge</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="ui.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bg-dark: #050505; --panel-bg: #151515; --cyan: #00d2ff; --pink: #ff007f; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        body { background-color: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 420px; height: 100dvh; max-height: 900px; background-color: var(--bg-dark); display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        
        .header { padding: 30px 20px 10px; text-align: center; font-size: 20px; font-weight: bold; color: var(--cyan); border-bottom: 1px solid #111; }
        
        .content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-y: auto; }
        
        .scanner-wrapper { position: relative; width: 100%; height: 320px; border-radius: 16px; overflow: hidden; border: 2px solid #222; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #reader { width: 100%; height: 100%; }

        .scanner-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; justify-content: center; align-items: center; z-index: 10; }
        .qr-target { width: 200px; height: 200px; position: relative; }

        .corner { position: absolute; width: 35px; height: 35px; border-color: var(--cyan); border-style: solid; border-width: 0; filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.8)); }
        .tl { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 12px; }
        .tr { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 12px; }
        .bl { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 12px; }
        .br { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 12px; }

        .laser { position: absolute; left: 5%; width: 90%; height: 2px; background: var(--cyan); box-shadow: 0 0 15px 2px var(--cyan); animation: scan-laser 2.5s infinite ease-in-out; }

        @keyframes scan-laser { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        
        #status { color: #aaa; font-size: 14px; margin-top: 25px; background: #151515; padding: 14px 20px; border-radius: 12px; border: 1px solid #333; text-align: center; width: 100%; font-weight: 500; }

        .upload-btn { margin-top: 15px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 20px; border-radius: 12px; border: 1px solid var(--pink); color: var(--pink); background: rgba(255, 0, 127, 0.08); font-size: 15px; font-weight: 600; cursor: pointer; }
        .upload-btn:active { background: rgba(255, 0, 127, 0.2); }
        .upload-btn svg { width: 20px; height: 20px; stroke: var(--pink); }
        .upload-hint { color: #777; font-size: 13px; margin-top: 8px; text-align: center; }

        /* 5-Tab Bar Navigation */
        .tab-bar { background-color: var(--panel-bg); padding: 10px 15px; display: flex; justify-content: space-around; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom, 15px); }
        .tab-link { text-decoration: none; display: flex; justify-content: center; align-items: center; padding: 8px; width: 20%; }
        .tab-link svg { stroke: #555; transition: all 0.3s ease; width: 26px; height: 26px; }
        .tab-link.active svg { stroke: var(--cyan); filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.6)); }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">VIP Scanner</div>
    <div class="content">
        <div class="scanner-wrapper">
            <div id="reader"></div>
            <div class="scanner-overlay">
                <div class="qr-target">
                    <div class="corner tl"></div><div class="corner tr"></div>
                    <div class="corner bl"></div><div class="corner br"></div>
                    <div class="laser"></div>
                </div>
            </div>
        </div>
        <p id="status">Kamera startet...</p>

        <!-- Digitaler Bon: QR-Code aus Screenshot / Foto am Handy auslesen -->
        <label class="upload-btn" for="qr-file">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            Digitalen Bon hochladen
        </label>
        <input type="file" id="qr-file" accept="image/*" hidden>
        <p class="upload-hint">Screenshot vom digitalen Beleg auswählen</p>
    </div>
    
    <div class="tab-bar">
        <a href="index.html" class="tab-link"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></a>
        <a href="karte.html" class="tab-link"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3l-8 11.5V22H10v-7.5L2 3h20z"></path><line x1="8" y1="22" x2="16" y2="22"></line></svg></a>
        <a href="scanner.html" class="tab-link active">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-3"></path>
                <rect x="7" y="7" width="4" height="4" rx="0.5"></rect><rect x="13" y="7" width="4" height="4" rx="0.5"></rect><rect x="7" y="13" width="4" height="4" rx="0.5"></rect><rect x="13" y="13" width="4" height="4" rx="0.5"></rect>
            </svg>
        </a>
        <a href="events.html" class="tab-link"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></a>
        <a href="kontakt.html" class="tab-link"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></a>
    </div>
</div>

<script>
    const sb = supabase.createClient(
        'https://bbtjimaixtekzejoslfw.supabase.co', 
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJidGppbWFpeHRla3plam9zbGZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4ODg4MDAsImV4cCI6MjA5NzQ2NDgwMH0.7-CCHxAaLbhj9wmKtNoTeYyiBYAXelsZsI3riA6yeOY'
    );
    
    const html5QrCode = new Html5Qrcode("reader", { 
        formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ] 
    });
    
    let busy = false;

    function startCamera() {
        const statusEl = document.getElementById('status');
        return html5QrCode.start(
            { facingMode: "environment" },
            { fps: 15 },
            async (decodedText) => {
                if (busy) return;
                let clean = decodedText.trim();

                // Nur österreichische Kassenbons (RKSV-QR) – geprüft wird am Server
                if (!clean.startsWith("_R1-AT")) {
                    return;
                }

                busy = true;
                html5QrCode.stop();
                processScannedQR(clean);
            }
        ).then(() => { statusEl.innerText = "📸 Halte den QR-Code vom Kassenbon ins Feld."; statusEl.style.color = "#aaa"; })
         .catch(err => { console.error(err); statusEl.innerText = "⚠️ Kamerazugriff verweigert. Du kannst den Bon aber unten als Bild hochladen."; statusEl.style.color = "#ff3333"; });
    }
    startCamera();

    // DIGITALER BON: QR-Code aus einem Bild (Screenshot / Foto) lesen
    document.getElementById('qr-file').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        e.target.value = ""; // gleiches Bild nochmal wählbar
        if (!file || busy) return;

        const statusEl = document.getElementById('status');
        statusEl.innerText = "🔍 Bild wird gelesen...";
        statusEl.style.color = "var(--cyan)";
        busy = true;

        // Kamera muss aus sein, sonst kann die Bibliothek kein Bild scannen
        try { if (html5QrCode.isScanning) await html5QrCode.stop(); } catch (_) {}

        let text = null;
        try {
            text = await html5QrCode.scanFile(file, false);
        } catch (_) {
            // 2. Versuch: Bild invertieren (manche Apps zeigen den QR-Code hell auf dunkel)
            try { text = await html5QrCode.scanFile(await invertImage(file), false); } catch (_) {}
        }

        // Per Upload werden nur echte Kassenbons akzeptiert (kein Festcode-Screenshot)
        if (text && text.trim().startsWith("_R1-AT")) {
            processScannedQR(text.trim());
        } else {
            busy = false;
            await startCamera();
            statusEl.innerText = "❌ Kein gültiger Bon-QR-Code im Bild gefunden. Bitte Screenshot mit gut sichtbarem QR-Code wählen.";
            statusEl.style.color = "#ff3333";
        }
    });

    function invertImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = img.naturalWidth; c.height = img.naturalHeight;
                const ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const d = ctx.getImageData(0, 0, c.width, c.height);
                for (let i = 0; i < d.data.length; i += 4) {
                    d.data[i] = 255 - d.data[i];
                    d.data[i + 1] = 255 - d.data[i + 1];
                    d.data[i + 2] = 255 - d.data[i + 2];
                }
                ctx.putImageData(d, 0, 0);
                URL.revokeObjectURL(img.src);
                c.toBlob(b => b ? resolve(new File([b], "inverted.png", { type: "image/png" })) : reject(), "image/png");
            };
            img.onerror = reject;
            img.src = URL.createObjectURL(file);
        });
    }

    async function processScannedQR(textData) {
        const statusEl = document.getElementById('status');
        statusEl.innerText = "Beleg wird geprüft...";
        statusEl.style.color = "var(--cyan)";

        let token = null;
        try { token = localStorage.getItem('midus_token'); } catch (_) {}
        if (!token) {
            await uiAlert("Nicht angemeldet", "Bitte melde dich zuerst mit E-Mail und PIN an, um Bons einzulösen.", "info", "🔑");
            window.location.href = "index.html";
            return;
        }

        // Punkte werden am Server berechnet und gebucht – das Handy kann nichts mehr manipulieren
        const { data, error } = await sb.rpc('guest_claim_receipt', { p_token: token, p_code: textData });
        const r = (!error && data) ? data : { error: 'NETWORK' };

        if (r.error) {
            const msg = {
                SESSION_INVALID: ["Bitte neu anmelden", "Deine Anmeldung ist abgelaufen.", "info", "🔑"],
                FOREIGN: ["Beleg abgelehnt", "Dieser Beleg stammt nicht von der Midus Lounge.", "error", "🚫"],
                ALREADY: ["Schon eingelöst", "Dieser Kassenbon wurde bereits für Pointz verwendet.", "error", "🚨"],
                TOO_OLD: ["Bon zu alt", "Bons können nur innerhalb von <b>7 Tagen</b> eingelöst werden.", "error", "📅"],
                ZERO: ["Kein Umsatz", "Auf diesem Bon stehen 0,00 € – dafür gibt's leider keine Pointz.", "error", "🧾"],
                INVALID: ["Ungültiger Beleg", "Dieser QR-Code konnte nicht als Kassenbon erkannt werden.", "error", "⚠️"],
                NETWORK: ["Verbindungsproblem", "Bitte prüfe dein Internet und versuch es nochmal.", "error", "📶"]
            }[r.error] || ["Fehler", "Da ist etwas schiefgelaufen.", "error", "⚠️"];
            await uiAlert(msg[0], msg[1], msg[2], msg[3]);
            if (r.error === 'SESSION_INVALID') {
                try { localStorage.removeItem('midus_token'); } catch (_) {}
                window.location.href = "index.html";
            } else {
                location.reload();
            }
            return;
        }

        // Erfolg wird auf der Startseite mit hochzählenden Pointz angezeigt
        const umsatz = Number(r.amount).toFixed(2).replace('.', ',');
        sessionStorage.setItem('midus_gain', JSON.stringify({ points: r.points_added, icon: "🧾", title: "Bon erfasst!",
            text: `Umsatz: <b>${umsatz} €</b>\nDir wurden <b>+${r.points_added} Pointz</b> gutgeschrieben.` }));
        window.location.href = "index.html";
    }
</script>
</body>
</html>
